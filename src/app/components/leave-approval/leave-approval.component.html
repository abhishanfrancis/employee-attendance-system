<!-- src/app/components/leave-approval/leave-approval.component.html -->

<div class="leave-approval-container">
    <h1>Leave Approval</h1>

    <mat-card>
        <mat-card-header>
            <mat-card-title>Leave Requests</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <table mat-table [dataSource]="leaveRequests">

                <ng-container matColumnDef="employeeName">
                    <th mat-header-cell *matHeaderCellDef>Employee Name</th>
                    <td mat-cell *matCellDef="let leave">{{ leave.employeeName }}</td>
                </ng-container>

                <ng-container matColumnDef="leaveType">
                    <th mat-header-cell *matHeaderCellDef>Leave Type</th>
                    <td mat-cell *matCellDef="let leave">{{ leave.leaveType }}</td>
                </ng-container>

                <ng-container matColumnDef="startDate">
                    <th mat-header-cell *matHeaderCellDef>Start Date</th>
                    <td mat-cell *matCellDef="let leave">{{ leave.startDate | date }}</td>
                </ng-container>

                <ng-container matColumnDef="endDate">
                    <th mat-header-cell *matHeaderCellDef>End Date</th>
                    <td mat-cell *matCellDef="let leave">{{ leave.endDate | date }}</td>
                </ng-container>

                <ng-container matColumnDef="reason">
                    <th mat-header-cell *matHeaderCellDef>Reason</th>
                    <td mat-cell *matCellDef="let leave">{{ leave.reason }}</td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let leave">
                        <span [class]="'status-badge ' + leave.status.toLowerCase()">
                            {{ leave.status }}
                        </span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let leave">
                        <button mat-raised-button color="primary" (click)="approveLeave(leave.id)"
                            [disabled]="leave.status !== 'Pending'">
                            Approve
                        </button>
                        <button mat-raised-button color="warn" (click)="rejectLeave(leave.id)"
                            [disabled]="leave.status !== 'Pending'" style="margin-left: 10px;">
                            Reject
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </mat-card-content>
    </mat-card>
</div>
