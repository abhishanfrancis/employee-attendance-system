<!-- src/app/components/leave-request/leave-request.component.html -->

<div class="leave-request-container">
    <h1>Apply for Leave</h1>

    <mat-card>
        <mat-card-header>
            <mat-card-title>Leave Request Form</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()">
                <div class="form-row">
                    <mat-form-field appearance="outline">
                        <mat-label>Employee</mat-label>
                        <mat-select formControlName="employeeId">
                            <mat-option *ngFor="let emp of employees" [value]="emp.id">
                                {{ emp.name }}
                            </mat-option>
                        </mat-select>
                        <mat-error *ngIf="leaveForm.get('employeeId')?.hasError('required')">
                            Employee is required
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Leave Type</mat-label>
                        <mat-select formControlName="leaveType">
                            <mat-option *ngFor="let type of leaveTypes" [value]="type">
                                {{ type }}
                            </mat-option>
                        </mat-select>
                        <mat-error *ngIf="leaveForm.get('leaveType')?.hasError('required')">
                            Leave type is required
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="form-row">
                    <mat-form-field appearance="outline">
                        <mat-label>Start Date</mat-label>
                        <input matInput [matDatepicker]="startPicker" formControlName="startDate">
                        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
                        <mat-datepicker #startPicker></mat-datepicker>
                        <mat-error *ngIf="leaveForm.get('startDate')?.hasError('required')">
                            Start date is required
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>End Date</mat-label>
                        <input matInput [matDatepicker]="endPicker" formControlName="endDate">
                        <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
                        <mat-datepicker #endPicker></mat-datepicker>
                        <mat-error *ngIf="leaveForm.get('endDate')?.hasError('required')">
                            End date is required
                        </mat-error>
                    </mat-form-field>
                </div>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Reason</mat-label>
                    <textarea matInput formControlName="reason" rows="4"
                        placeholder="Enter reason for leave"></textarea>
                    <mat-error *ngIf="leaveForm.get('reason')?.hasError('required')">
                        Reason is required
                    </mat-error>
                </mat-form-field>

                <div class="button-group">
                    <button mat-raised-button color="primary" type="submit" [disabled]="!leaveForm.valid">
                        Submit Leave Request
                    </button>
                    <button mat-raised-button type="button" (click)="leaveForm.reset()">
                        Reset
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
