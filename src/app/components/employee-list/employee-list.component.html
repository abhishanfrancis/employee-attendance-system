<!-- src/app/components/employee-list/employee-list.component.html -->

<div class="employee-list-container">
    <h1>Employee List</h1>

    <mat-card>
        <mat-card-content>
            <table mat-table [dataSource]="employees" class="employee-table">

                <!-- ID Column -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>ID</th>
                    <td mat-cell *matCellDef="let employee">{{ employee.id }}</td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let employee">{{ employee.name }}</td>
                </ng-container>

                <!-- Email Column -->
                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef>Email</th>
                    <td mat-cell *matCellDef="let employee">{{ employee.email }}</td>
                </ng-container>

                <!-- Department Column -->
                <ng-container matColumnDef="department">
                    <th mat-header-cell *matHeaderCellDef>Department</th>
                    <td mat-cell *matCellDef="let employee">{{ employee.department }}</td>
                </ng-container>

                <!-- Position Column -->
                <ng-container matColumnDef="position">
                    <th mat-header-cell *matHeaderCellDef>Position</th>
                    <td mat-cell *matCellDef="let employee">{{ employee.position }}</td>
                </ng-container>

                <!-- Join Date Column -->
                <ng-container matColumnDef="joinDate">
                    <th mat-header-cell *matHeaderCellDef>Join Date</th>
                    <td mat-cell *matCellDef="let employee">{{ employee.joinDate | date }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </mat-card-content>
    </mat-card>
</div>
